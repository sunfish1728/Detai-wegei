<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>偉哲跑酷</title>
<link rel="stylesheet" href="css/font.css">
<style>
  :root {
    --yellow: #ffd23f;
    --orange: #ff9a1f;
    --pink: #ff3d7f;
    --blue: #2bb3ff;
    --green: #3ddc84;
    --ink: #1b1b2f;
    --num: "Titan One", "Arial Black", system-ui, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #7cc6ff;
    font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
    color: #fff; user-select: none; -webkit-user-select: none; touch-action: none;
  }
  #game { position: fixed; inset: 0; display: block; width: 100%; height: 100%; }
  .outline { text-shadow: 0 3px 0 var(--ink), 2px 0 0 var(--ink), -2px 0 0 var(--ink), 0 -2px 0 var(--ink), 2px 2px 0 var(--ink), -2px 2px 0 var(--ink); }

  /* ---------- HUD ---------- */
  .hud { position: fixed; inset: 0; pointer-events: none; display: none; }
  .hud.show { display: block; }
  .hud .top { position: absolute; top: max(12px, env(safe-area-inset-top)); left: 16px; right: 16px;
    display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .left { display: flex; gap: 10px; align-items: center; }
  .right { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
  .score { font-family: var(--num); font-size: clamp(30px, 6vw, 44px); line-height: 1; letter-spacing: 1px; }
  .coins { display: flex; align-items: center; gap: 6px; font-family: var(--num); font-size: clamp(22px, 4.5vw, 30px); color: var(--yellow); }
  .coin-ic { width: 26px; height: 26px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #fff3a0, #ffc400 45%, #c98a00);
    border: 2px solid var(--ink); display: inline-flex; align-items: center; justify-content: center; font-size: 13px; color: #8a5a00; font-weight: 900; text-shadow: none; }
  .mult { font-family: var(--num); font-size: 20px; padding: 2px 12px; border-radius: 10px; background: var(--pink); border: 2px solid var(--ink); }
  .mult.x2 { background: #c86bff; animation: pulse .6s infinite alternate; }
  @keyframes pulse { to { transform: scale(1.12); } }
  .btn-icon { pointer-events: auto; border: 2px solid var(--ink); background: rgba(255,255,255,.9); color: var(--ink); font-size: 18px;
    width: 42px; height: 42px; border-radius: 12px; cursor: pointer; box-shadow: 0 3px 0 var(--ink); }
  .powers { position: absolute; left: 16px; bottom: max(16px, env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 6px; }
  .power { display: flex; align-items: center; gap: 8px; background: rgba(27,27,47,.6); border-radius: 14px; padding: 4px 10px 4px 6px; border: 2px solid rgba(255,255,255,.25); }
  .power .ic { font-size: 22px; width: 28px; text-align: center; }
  .power .bar { width: 96px; height: 10px; border-radius: 5px; background: rgba(255,255,255,.2); overflow: hidden; }
  .power .bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--yellow), var(--orange)); }
  .board-btn { position: absolute; right: 16px; bottom: max(16px, env(safe-area-inset-bottom)); pointer-events: auto; cursor: pointer;
    width: 74px; height: 74px; border-radius: 20px; border: 3px solid var(--ink); background: linear-gradient(180deg, #7ef0ff, #2bb3ff);
    box-shadow: 0 4px 0 var(--ink); font-size: 30px; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #fff; }
  .board-btn b { font-family: var(--num); font-size: 16px; font-weight: 400; line-height: 1; }
  .board-btn:disabled { filter: grayscale(1); opacity: .5; }
  .board-btn.on { background: linear-gradient(180deg, #b7ff9a, #3ddc84); }
  .toast { position: absolute; top: 24%; left: 0; right: 0; text-align: center; font-size: clamp(26px, 6vw, 40px); font-weight: 900;
    color: var(--yellow); opacity: 0; transform: scale(.6); transition: opacity .2s, transform .25s cubic-bezier(.3,1.8,.5,1); }
  .toast.show { opacity: 1; transform: scale(1); }
  .count { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: var(--num); font-size: 120px; color: var(--yellow); }
  .flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; transition: opacity .35s; }
  .flash.on { opacity: .7; transition: none; }
  .speedlines { position: fixed; inset: 0; pointer-events: none; opacity: 0; transition: opacity .4s;
    background: repeating-conic-gradient(from 0deg at 50% 45%, rgba(255,255,255,.0) 0deg 4deg, rgba(255,255,255,.18) 4.4deg 5deg);
    -webkit-mask: radial-gradient(ellipse at 50% 45%, transparent 38%, #000 75%); mask: radial-gradient(ellipse at 50% 45%, transparent 38%, #000 75%); }

  /* ---------- 畫面 ---------- */
  .screen { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; padding: 16px; overflow-y: auto;
    background: radial-gradient(ellipse at 50% 30%, rgba(43,179,255,.35), rgba(20,10,60,.82) 70%); }
  .screen.show { display: flex; }
  .panel { width: min(780px, 100%); text-align: center; margin: auto; }
  h1 { margin: 0; font-size: clamp(46px, 11vw, 92px); line-height: 1; font-weight: 900; letter-spacing: 2px;
    color: var(--yellow); transform: rotate(-4deg);
    text-shadow: 0 5px 0 var(--pink), 0 10px 0 var(--ink), 4px 0 0 var(--ink), -4px 0 0 var(--ink), 0 -4px 0 var(--ink); }
  h1 small { display: block; font-family: var(--num); font-size: .32em; letter-spacing: 6px; color: #fff; margin-top: 10px;
    text-shadow: 0 3px 0 var(--ink); }
  .sub { margin: 18px 0 16px; font-size: 15px; opacity: .9; }
  .cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 18px; }
  @media (max-width: 560px) { .cards { grid-template-columns: repeat(2, 1fr); gap: 10px; } }
  .card { position: relative; pointer-events: auto; cursor: pointer; border: 3px solid var(--ink); border-radius: 18px; padding: 10px 6px 10px;
    background: linear-gradient(180deg, #ffffff, #dfe9ff); color: var(--ink); font: inherit; box-shadow: 0 5px 0 var(--ink);
    transition: transform .15s; overflow: hidden; }
  .card::before { content: ""; position: absolute; inset: 0; background: radial-gradient(circle at 50% 40%, rgba(43,179,255,.35), transparent 65%); }
  .card img { position: relative; width: 100%; height: 118px; object-fit: contain; display: block; filter: drop-shadow(0 4px 3px rgba(0,0,0,.35)); }
  .card b { position: relative; display: block; font-size: 17px; margin-top: 6px; }
  .card small { position: relative; display: block; opacity: .7; font-size: 12px; margin-top: 2px; }
  .card.sel { background: linear-gradient(180deg, #fff6c2, #ffd23f); transform: translateY(-4px) rotate(-1.5deg); }
  .card.sel::after { content: "✓"; position: absolute; top: 6px; right: 8px; width: 24px; height: 24px; border-radius: 50%;
    background: var(--green); border: 2px solid var(--ink); color: #fff; font-weight: 900; font-size: 14px; line-height: 20px; }
  .btn { pointer-events: auto; cursor: pointer; border: 3px solid var(--ink); border-radius: 18px; padding: 12px 40px; margin: 6px;
    font: inherit; font-size: 24px; font-weight: 900; color: var(--ink); background: linear-gradient(180deg, #ffe680, var(--yellow));
    box-shadow: 0 6px 0 var(--ink); }
  .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--ink); }
  .btn.alt { background: linear-gradient(180deg, #7ad3ff, var(--blue)); color: #fff; text-shadow: 0 2px 0 var(--ink); }
  .btn:disabled { filter: grayscale(1); opacity: .6; }
  .help { margin-top: 18px; font-size: 13px; opacity: .85; line-height: 1.9; }
  .help b { font-family: var(--num); font-weight: 400; color: var(--yellow); font-size: 16px; }
  kbd { background: rgba(255,255,255,.18); border: 1px solid rgba(255,255,255,.35); border-radius: 5px; padding: 0 6px; font-family: inherit; }
  .big { font-family: var(--num); font-size: 64px; color: var(--yellow); margin: 6px 0; }
  .stats { display: flex; justify-content: center; gap: 28px; margin: 6px 0 18px; font-size: 16px; }
  .stats div span { display: block; font-family: var(--num); font-size: 28px; }
  .new-best { display: none; font-weight: 900; color: var(--green); font-size: 20px; animation: pulse .5s infinite alternate; }
  .new-best.show { display: block; }
  .over-img { width: 170px; height: 170px; object-fit: contain; filter: drop-shadow(0 6px 6px rgba(0,0,0,.5)); transform: rotate(-10deg); animation: wobble 1.2s ease-in-out infinite alternate; }
  @keyframes wobble { to { transform: rotate(8deg) scale(1.05); } }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div class="speedlines" id="speedlines"></div>

<div class="hud" id="hud">
  <div class="top">
    <div class="left">
      <button class="btn-icon" id="pauseBtn" aria-label="暫停">❚❚</button>
      <div class="coins outline"><span class="coin-ic">偉</span><span id="coinTxt">0</span></div>
    </div>
    <div class="right">
      <div class="score outline" id="scoreTxt">0</div>
      <div class="mult outline" id="multTxt">x1</div>
    </div>
  </div>
  <div class="powers" id="powers"></div>
  <button class="board-btn" id="boardBtn" aria-label="滑板">🛹<b id="boardTxt">x3</b></button>
  <div class="toast outline" id="toast"></div>
  <div class="count outline" id="count"></div>
</div>
<div class="flash" id="flash"></div>

<div class="screen show" id="menu">
  <div class="panel">
    <h1>偉哲跑酷<small>SUBWAY WEIZHE</small></h1>
    <div class="sub">偉哲在鐵軌上塗鴉被抓包了！快跑！</div>
    <div class="cards" id="cards"></div>
    <button class="btn" id="startBtn" disabled>載入中…</button>
    <div class="help">
      電腦：<kbd>←</kbd><kbd>→</kbd> 換軌道　<kbd>↑</kbd>/<kbd>空白</kbd> 跳　<kbd>↓</kbd> 滾　<kbd>Shift</kbd> 滑板　<kbd>P</kbd> 暫停<br>
      手機：左右滑換軌道、上滑跳、下滑滾、點兩下用滑板<br>
      最高分 <b id="bestTxt">0</b>
    </div>
  </div>
</div>

<div class="screen" id="pauseScreen">
  <div class="panel">
    <h1>暫停</h1>
    <div style="height:28px"></div>
    <button class="btn" id="resumeBtn">繼續</button>
    <button class="btn alt" id="quitBtn">回主選單</button>
    <div class="help">
      <button class="btn-icon" id="muteBtn" aria-label="音效">🔊</button>
      <button class="btn-icon" id="musicBtn" aria-label="音樂">🎵</button>
    </div>
  </div>
</div>

<div class="screen" id="overScreen">
  <div class="panel">
    <img class="over-img" id="overImg" alt="">
    <h1 id="overTitle">被抓到了！</h1>
    <div class="big outline" id="overScore">0</div>
    <div class="new-best" id="newBest">🎉 新紀錄！</div>
    <div class="stats">
      <div>金幣<span class="outline" id="overCoins">0</span></div>
      <div>距離<span class="outline" id="overDist">0</span></div>
      <div>最高分<span class="outline" id="overBest">0</span></div>
    </div>
    <button class="btn" id="againBtn">再跑一次</button>
    <button class="btn alt" id="menuBtn">換角色</button>
  </div>
</div>

<script src="js/three.min.js"></script>
<script src="js/assets.js"></script>
<script src="js/game.js"></script>
</body>
</html>
